apiVersion: apps/v1
kind: Deployment
metadata:
  name: authdb
  namespace: academic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authdb
  template:
    metadata:
      labels:
        app: authdb
    spec:
      containers:
        - name: authdb
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: authdb
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: authdb
  namespace: academic
spec:
  selector:
    app: authdb
  ports:
    - port: 5432
      targetPort: 5432