apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: academic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      containers:
        - name: bff
          image: academic-platform-bff:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SERVICES_AUTH-URL
              value: http://authservice:8081
            - name: SERVICES_STUDENT-URL
              value: http://studentservice:8082
            - name: SERVICES_ATTENDANCE-URL
              value: http://attendanceservice:8083
            - name: SERVICES_ASSIGNMENT-URL
              value: http://assignmentservice:8084
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: academic
spec:
  type: NodePort
  selector:
    app: bff
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080