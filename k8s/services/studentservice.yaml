apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentservice
  namespace: academic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studentservice
  template:
    metadata:
      labels:
        app: studentservice
    spec:
      containers:
        - name: studentservice
          image: academic-platform-studentservice:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
            - containerPort: 9090
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://studentdb:5432/studentdb
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: postgres
            - name: SPRING_GRPC_SERVER_PORT
              value: "9090"
---
apiVersion: v1
kind: Service
metadata:
  name: studentservice
  namespace: academic
spec:
  selector:
    app: studentservice
  ports:
    - name: http
      port: 8082
      targetPort: 8082
    - name: grpc
      port: 9090
      targetPort: 9090