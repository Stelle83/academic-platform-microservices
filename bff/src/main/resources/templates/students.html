<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Students — Academic Platform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav>
    <div>
        <a href="/dashboard">🏠 Home</a>
        <a href="/students">👥 Students</a>
        <a href="/attendance">📋 Attendance</a>
        <a href="/assignments">📝 Assignments</a>
    </div>
    <div class="nav-right">
        <span th:text="${username}"></span> |
        <a href="/logout" style="color:#e74c3c">Logout</a>
    </div>
</nav>

<div class="container">

    <!-- Create Student Form - teachers only -->
    <div class="card" th:if="${role == 'TEACHER'}">
        <h2>➕ Register New Student</h2>
        <div id="create-result"></div>

        <form id="create-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Anna Svensson" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="anna.svensson" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="anna@school.se" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Temporary password" required>
            </div>
            <button type="submit" class="btn btn-success">Register Student</button>
        </form>
    </div>

    <!-- Students List -->
    <div class="card">
        <h1>👥 My Students</h1>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div id="students-list">Loading...</div>
    </div>

</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const studentsJson = /*[[${studentsJson}]]*/ '[]';
    const role = /*[[${role}]]*/ '';
    const teacherId = /*[[${userId}]]*/ '';

    async function getToken() {
        const res = await fetch('/api/session/token');
        const data = await res.json();
        return data.token;
    }

    async function loadStudents() {
        const list = document.getElementById('students-list');
        if (!list) return;

        try {
            const students = JSON.parse(studentsJson || '[]');

            if (students.length === 0) {
                list.innerHTML = '<p style="color:#777">No students found. Register your first student above!</p>';
                return;
            }

            let html = '<table><thead><tr>' +
                '<th>Full Name</th>' +
                '<th>Username</th>' +
                '<th>Email</th>' +
                '<th>Actions</th>' +
                '</tr></thead><tbody>';

            students.forEach(s => {
                html += `<tr>
                    <td>${s.fullName}</td>
                    <td>${s.username}</td>
                    <td>${s.email}</td>
                    <td style="display:flex;gap:8px">
                        <a href="/attendance?studentId=${s.id}"
                           style="color:#3498db;text-decoration:none">
                           📋 Attendance
                        </a>
                        <a href="/assignments?studentId=${s.id}"
                           style="color:#27ae60;text-decoration:none">
                           📝 Assignments
                        </a>
                    </td>
                </tr>`;
            });

            html += '</tbody></table>';
            list.innerHTML = html;

        } catch (err) {
            console.error('Parse error:', err);
            list.innerHTML = '<p style="color:#c0392b">Error loading students.</p>';
        }
    }

    async function setupCreateForm() {
        const form = document.getElementById('create-form');
        if (!form) return;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = await getToken();
            const result = document.getElementById('create-result');

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('fullName').value;

            result.innerHTML = '<div class="alert" style="background:#eaf4fb;' +
                'color:#1a5276;border:1px solid #aed6f1">Registering account...</div>';

            // Step 1 — Register in Auth Service
            let studentUserId = null;
            try {
                const authRes = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username, email, password, role: 'STUDENT'
                    })
                });

                const rawText = await authRes.text();
                console.log('Auth response status:', authRes.status);
                console.log('Auth response body:', rawText);

                if (!authRes.ok) {
                    result.innerHTML = `<div class="alert alert-error">
                        Registration failed: ${rawText}
                    </div>`;
                    return;
                }

                const authData = JSON.parse(rawText);
                studentUserId = authData.userId;
                console.log('Got studentUserId:', studentUserId);

            } catch (err) {
                console.error('Auth register error:', err);
                result.innerHTML =
                    '<div class="alert alert-error">Auth error</div>';
                return;
            }

            if (!studentUserId) {
                result.innerHTML = '<div class="alert alert-error">' +
                    'Could not get student ID!</div>';
                return;
            }

            // Step 2 — Create student profile
            result.innerHTML = '<div class="alert" style="background:#eaf4fb;' +
                'color:#1a5276;border:1px solid #aed6f1">Creating profile...</div>';

            try {
                const studentRes = await fetch('/api/students', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        id: studentUserId,
                        username,
                        email,
                        fullName,
                        teacherId
                    })
                });

                if (!studentRes.ok) {
                    const err = await studentRes.text();
                    result.innerHTML = `<div class="alert alert-error">
                        Profile creation failed: ${studentRes.status}
                    </div>`;
                    console.error('Student create error:', err);
                    return;
                }

                result.innerHTML =
                    '<div class="alert alert-success">✅ Student registered!</div>';
                form.reset();
                setTimeout(() => location.reload(), 1500);

            } catch (err) {
                console.error('Student create error:', err);
                result.innerHTML =
                    '<div class="alert alert-error">Network error</div>';
            }
        }); // ← closes form.addEventListener

    } // ← closes setupCreateForm function

    document.addEventListener('DOMContentLoaded', () => {
        loadStudents();
        setupCreateForm();
    });
    /*]]>*/
</script>

</body>
</html>
