<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Attendance — Academic Platform</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav>
    <div>
        <a href="/dashboard">🏠 Home</a>
        <a href="/students">👥 Students</a>
        <a href="/attendance">📋 Attendance</a>
        <a href="/assignments">📝 Assignments</a>
    </div>
    <div class="nav-right">
        <a href="/logout" style="color:#e74c3c">Logout</a>
    </div>
</nav>

<div class="container">
    <div class="card">
        <h1>📋 Record Attendance</h1>
        <div id="result"></div>

        <form id="attendance-form">
            <div class="form-group">
                <label>Student ID</label>
                <input type="text" id="studentId" name="studentId"
                       th:value="${param.studentId}" required>
            </div>
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="status" name="status">
                    <option value="PRESENT">Present</option>
                    <option value="LATE">Late</option>
                    <option value="ABSENT">Absent</option>
                    <option value="SICK">Sick</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Record</button>
        </form>
    </div>
</div>

<script th:inline="javascript">
    const teacherId = [[${userId}]];

    async function getToken() {
        const res = await fetch('/api/session/token');
        const data = await res.json();
        return data.token;
    }

    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    document.getElementById('attendance-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = await getToken();
        const body = {
            studentId: document.getElementById('studentId').value,
            teacherId: teacherId,
            date: document.getElementById('date').value,
            status: document.getElementById('status').value
        };

        const res = await fetch('/api/attendance', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify(body)
        });

        const result = document.getElementById('result');
        if (res.ok) {
            result.innerHTML = '<div class="alert alert-success">Attendance recorded!</div>';
        } else {
            result.innerHTML = `<div class="alert alert-error">Failed: ${res.status}</div>`;
        }
    });
</script>
</body>
</html>
