spring.application.name=bff
server.port=8080

# JWT secret - must match auth-service exactly!
jwt.secret=your-super-secret-key-that-is-at-least-256-bits-long-for-security
jwt.expiration=86400000

# Internal service URLs
services.auth-url=http://localhost:8081
services.student-url=http://localhost:8082
services.attendance-url=http://localhost:8083
services.assignment-url=http://localhost:8084
services.notification-url=http://localhost:8085

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html